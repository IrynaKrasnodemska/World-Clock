<!doctype html>
<html lang="en">
  <head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <link rel="stylesheet" href="CSS/style.css" />
    <title>World Clock - Iryna Krasnodemska</title>

  <body>
    <div class="content">
    <h1>World Clocks</h1>
   <select>
        <option value="">Select a city...</option>
        <option value="">Madrid</option>

        <option value="">Sydney</option>

      </select>
 <div class="city">
        <h2>Madrid 🇪🇸</h2>

      </div>
      <div class="city">
        <h2>New York 🇺🇸</h2>
        <div class="date">August 15th 2022</div>
        <div class="time">1:48:15 AM</div>
      </div>
      <div class="city">
        <h2>Sydney 🇦🇺</h2>
        <div class="date">August 15th 2022</div>
        <div class="time">1:48:15 AM</div>
      </div>
      <div class="city">
        <h2>Kyiv 🇺🇦</h2>
        <div class="date">August 15th 2022</div>
        <div class="time">1:48:15 AM</div>
      </div>
      
    <footer>

    </footer>
