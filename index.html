<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>

    <title>World Clock - Iryna Krasnodemska</title>
  </head>
  <body>
    <div class="content">
      <h1>World Clocks</h1>

      <select class="option" id="city" required>
        <option value="" disabled selected class="placeholder-option">
          Select a city...
        </option>
        <option value="current">My current location</option>
        <option value="Europe/Lisbon">Lisbon</option>
        <option value="America/New_York">Washington</option>
        <option value="Australia/Brisbane">Brisbane</option>
        <option value="Asia/Tokyo">Tokyo</option>
      </select>

      <div id="cities">
        <div class="city" id="madrid">
          <div>
            <h2>Madrid 🇪🇸</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>

        <div class="city" id="new_york">
          <div>
            <h2>New York 🇺🇸</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>

        <div class="city" id="sydney">
          <div>
            <h2>Sydney 🇦🇺</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>

        <div class="city" id="kyiv">
          <div>
            <h2>Kyiv 🇺🇦</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
      </div>
    </div>
    <footer>
      This project was coded with ❤️ by
      <strong class="username">Iryna Krasnodemska</strong> and is
      <a
        href="https://github.com/IrynaKrasnodemska/World-Clock"
        target="_blank"
        class="link"
      >
        open sourced on GitHub</a
      >
    </footer>
    <script src="JavaScript/index.js"></script>
  </body>
</html>
